[project]
name = "ephemeral-guidance"
version = "0.1.0"
description = "Lightweight insights scaffold over family financial data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0.0",
  "polars>=1.0.0",
  "pydantic>=2.6.0",
  "typer>=0.12.0",
]

[project.scripts]
ephemeral-guidance = "ephemeral_guidance.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
