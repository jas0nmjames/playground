<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medianville Data Explorer</title>
<meta name="description" content="The Medianville data explorer: one simulated day of a synthetic American city as tables of records, households, people and organizations to filter, search and group. Synthetic data built from real research; no real people.">
<link rel="canonical" href="https://medianville.netlify.app/explorer/">
<link rel="alternate" type="text/markdown" href="/llms.txt" title="For agents and LLMs">
<meta property="og:title" content="Medianville Data Explorer">
<meta property="og:description" content="The Medianville data explorer: one simulated day of a synthetic American city as tables of records, households, people and organizations to filter, search and group. Synthetic data built from real research; no real people.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Medianville Data Explorer: browse one day's run as tables (the day comes from data/runs/manifest.json, or ?run=<id>).
   Same tokens as Medianville in Motion v3 so the two read as one project. */
:root { --page:#F3F5F8; --surface:#FFFFFF; --ink:#0E1B2E; --ink2:#5B6676; --ink3:#7D8797; --line:#DDE2EA; --ctrl:#7D8797;
  --blue:#1F5AF0; --blue-soft:#E8EEFE; --green:#0A7A4B; --fail:#BC2F52; --fail-soft:#FCEFF2; --r:12px;
  --shadow:0 1px 2px rgba(14,27,46,.06), 0 6px 20px rgba(14,27,46,.08);
  --ui: Figtree, "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --voice: "Source Serif 4", Georgia, "Times New Roman", serif; --head: 58px; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { font-family:var(--ui); color:var(--ink); background:var(--page); font-size:14.5px; font-variant-numeric:tabular-nums lining-nums;
  display:grid; grid-template-rows:auto minmax(0,1fr); grid-template-columns:minmax(0,1fr); height:100vh; height:100dvh; overflow:hidden; }
button, input, select { font-family:inherit; font-size:inherit; color:inherit; }
button { cursor:pointer; }
a { color:var(--blue); }
:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
[hidden] { display:none !important; }
.sr-only { position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* header */
header.top { position:relative; display:flex; align-items:center; gap:10px 18px; padding:10px 20px; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-right:auto; min-width:0; }
h1 { font-size:18px; font-weight:700; margin:0; letter-spacing:-.01em; }
.chip { font-size:13px; font-weight:600; color:var(--ink2); background:var(--page); border:1px solid var(--line); border-radius:999px; padding:5px 11px; white-space:nowrap; }
.runpick { border-radius:999px; min-height:32px; padding:4px 10px; font-size:13px; cursor:pointer; max-width:220px; } /* the longest day name would push About onto a second line */
.chip.err { color:var(--fail); border-color:var(--fail); background:var(--fail-soft); }
nav.tabs { display:flex; gap:2px; border:1px solid var(--ctrl); border-radius:999px; padding:3px; background:var(--surface); overflow-x:auto; max-width:100%; }
nav.tabs a { text-decoration:none; color:var(--ink2); font-weight:600; font-size:14px; padding:6px 13px; border-radius:999px; white-space:nowrap; min-height:32px; display:flex; align-items:center; }
nav.tabs a[aria-current="page"] { background:var(--ink); color:#fff; }
.ext { font-weight:600; font-size:14px; text-decoration:none; white-space:nowrap; }
.ext:hover { text-decoration:underline; }
#progress { position:absolute; left:0; right:0; bottom:-1px; height:3px; background:transparent; }
#progress i { display:block; height:100%; width:0; background:var(--blue); transition:width .2s; }

/* main */
main { position:relative; min-height:0; overflow:hidden; }
.loading { height:100%; display:grid; place-items:center; padding:24px; text-align:center; color:var(--ink2); }
.loading .box { max-width:440px; }
.loading h2 { color:var(--ink); font-size:20px; margin:0 0 6px; }
.loading .bar { height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin:14px auto 8px; max-width:320px; }
.loading .bar i { display:block; height:100%; width:0; background:var(--blue); border-radius:3px; }
.view { height:100%; }
.layout { display:grid; grid-template-columns:300px minmax(0,1fr); height:100%; }
aside.rail { background:var(--surface); border-right:1px solid var(--line); overflow:auto; padding:14px 16px 40px; overscroll-behavior:contain; }
.rail-h { display:flex; align-items:center; justify-content:space-between; margin:2px 0 10px; }
.rail-h h2 { font-size:16px; margin:0; }
.linkbtn { border:0; background:none; color:var(--blue); font-weight:600; padding:6px 0; text-align:left; white-space:nowrap; }
.linkbtn:disabled { color:var(--ink3); cursor:default; }
#rail-close { display:none; }
.content { overflow:auto; padding:16px 22px 60px; min-width:0; overscroll-behavior:contain; }

/* search and toolbar */
.searchrow { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.search { flex:1 1 320px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--ctrl); border-radius:999px; padding:0 14px; min-height:42px; }
.search input { border:0; outline:0; background:none; flex:1; min-width:0; font-size:15px; padding:9px 0; }
.search:focus-within { outline:2px solid var(--blue); outline-offset:1px; }
.search svg { flex:none; color:var(--ink2); }
.btn { border:1px solid var(--ctrl); background:var(--surface); border-radius:999px; padding:8px 14px; font-weight:600; font-size:14px; min-height:38px; white-space:nowrap; }
.btn:hover { border-color:var(--ink); }
.btn.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
.btn:disabled { opacity:.5; cursor:default; }
#filters-btn { display:none; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 0; }
.fchip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--blue); background:var(--blue-soft); color:var(--ink); border-radius:999px; padding:4px 6px 4px 11px; font-size:13px; font-weight:600; min-height:30px; }
.fchip small { color:var(--ink2); font-weight:500; }
.fchip button { border:0; background:none; width:22px; height:22px; border-radius:50%; font-size:15px; line-height:1; color:var(--ink2); display:grid; place-items:center; }
.fchip button:hover { background:#fff; color:var(--ink); }
.tiles { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin:14px 0; }
.tile { background:var(--surface); border-radius:var(--r); padding:11px 14px; box-shadow:var(--shadow); min-width:0; }
.tile .lbl { font-size:12.5px; color:var(--ink2); font-weight:600; display:block; }
.tile .val { display:block; font-size:21px; font-weight:700; letter-spacing:-.01em; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile .sub { font-size:12px; color:var(--ink2); }
.tile.bad .val { color:var(--fail); }
.toolbar { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; margin:6px 0 10px; }
.toolbar .count { font-weight:600; margin-right:auto; }
.toolbar label.sel { display:flex; align-items:center; gap:6px; color:var(--ink2); font-weight:600; font-size:13.5px; }
select { border:1px solid var(--ctrl); border-radius:10px; background:var(--surface); padding:7px 10px; min-height:36px; font-weight:600; color:var(--ink); max-width:100%; }
fieldset.seg { display:inline-flex; border:1px solid var(--ctrl); border-radius:999px; padding:3px; margin:0; background:var(--surface); gap:2px; }
fieldset.seg legend { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.seg input { position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.seg label { min-height:30px; padding:4px 13px; border-radius:999px; font-weight:600; font-size:13.5px; cursor:pointer; color:var(--ink2); display:flex; align-items:center; }
.seg input:checked + label { background:var(--ink); color:#fff; }
.seg input:focus-visible + label { outline:2px solid var(--blue); outline-offset:2px; }

/* facets */
details.facet { border-top:1px solid var(--line); padding:4px 0; }
details.facet > summary { list-style:none; display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer; padding:9px 2px; font-weight:700; font-size:14px; min-height:40px; }
details.facet > summary::-webkit-details-marker { display:none; }
details.facet > summary::after { content:""; width:8px; height:8px; border-right:2px solid var(--ink2); border-bottom:2px solid var(--ink2); transform:rotate(45deg); margin:0 4px 4px 0; flex:none; }
details.facet[open] > summary::after { transform:rotate(-135deg); margin-top:4px; margin-bottom:0; }
details.facet > summary .n { margin-left:auto; background:var(--blue); color:#fff; border-radius:999px; font-size:12px; padding:1px 8px; }
.fopts { display:flex; flex-direction:column; gap:1px; padding:0 0 8px; }
.fopt { display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:8px; align-items:center; padding:5px 6px; border-radius:8px; cursor:pointer; font-size:13.5px; min-height:32px; }
.fopt:hover { background:var(--page); }
.fopt input { width:16px; height:16px; margin:0; accent-color:var(--blue); }
.fopt .lab { min-width:0; overflow-wrap:anywhere; line-height:1.25; }
.fopt .lab small { display:block; color:var(--ink2); font-size:12px; }
.fopt .c { color:var(--ink2); font-size:12.5px; }
.fopt.zero { color:var(--ink3); }
.ffilter { width:100%; border:1px solid var(--line); border-radius:8px; padding:7px 10px; margin:0 0 6px; font-size:13.5px; }
.timepick { display:flex; gap:8px; align-items:center; padding:0 0 10px; font-size:13.5px; color:var(--ink2); }
.timepick select { flex:1; }

/* result rows */
.rows { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
.rhead, .rr { display:grid; gap:12px; align-items:center; padding:9px 14px; }
.rhead { font-size:12px; font-weight:700; color:var(--ink2); text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--line); background:#FAFBFC; }
.rr { width:100%; border:0; border-bottom:1px solid var(--line); background:none; text-align:left; font-size:14px; min-height:48px; }
.rr:last-child { border-bottom:0; }
.rr:hover { background:var(--page); }
.rr.sel { background:var(--blue-soft); box-shadow:inset 3px 0 0 var(--blue); }
.rr > span { min-width:0; }
.rr .num, .rhead .num { text-align:right; }
.rr b { font-weight:600; }
.rr small { display:block; color:var(--ink2); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.rr .one { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
.muted { color:var(--ink2); }
.bad { color:var(--fail); }
.good { color:var(--green); }
.hw { color:var(--blue); font-weight:700; }
.dot { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px; vertical-align:baseline; flex:none; }
.k-purchase { background:#1F5AF0; } .k-income { background:#0A7A4B; } .k-bill { background:#A86200; }
.k-service { background:#6B4FD8; border-radius:50%; } .k-unpaid { background:#0E7C86; transform:rotate(45deg) scale(.85); } .k-fail { background:var(--fail); border-radius:50% 50% 2px 50%; }
.g-rec { grid-template-columns:78px 132px minmax(0,1.6fr) minmax(0,1.3fr) 100px 92px; }
.g-hh { grid-template-columns:82px minmax(0,1.1fr) minmax(0,1.2fr) 96px 100px 72px 72px 84px; }
.g-per { grid-template-columns:86px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) 100px 72px; }
.g-org { grid-template-columns:minmax(0,1.8fr) minmax(0,1.2fr) 110px 84px 84px 110px; }
.g-grp { grid-template-columns:minmax(0,1.6fr) repeat(6,minmax(64px,.6fr)); }
.pager { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 0; flex-wrap:wrap; }
.pager .muted { font-size:13.5px; }
.empty { padding:32px 16px; text-align:center; color:var(--ink2); }
.rhead button.sorth { border:0; background:none; font:inherit; color:inherit; text-transform:inherit; letter-spacing:inherit; padding:0; text-align:right; width:100%; }
.rhead button.sorth[aria-pressed="true"] { color:var(--ink); }
.rhead button.sorth[aria-pressed="true"]::after { content:" ↓"; }
.gbar { display:block; height:6px; max-width:320px; border-radius:3px; background:var(--line); margin-top:6px; overflow:hidden; }
.gbar i { display:block; height:100%; background:var(--blue); border-radius:3px; }
.m-only, .rr small.m-only { display:none; }
.note { color:var(--ink2); font-size:13px; line-height:1.45; margin:18px 2px 0; max-width:60em; }

/* summary */
.sum { max-width:1100px; margin:0 auto; }
.sum h2 { font-size:22px; margin:6px 0 4px; }
.sum > p.lede { color:var(--ink2); margin:0 0 6px; max-width:52em; line-height:1.45; }
.cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:16px; }
.card { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); padding:16px 18px; min-width:0; }
.card.wide { grid-column:1 / -1; }
.card h3 { margin:0 0 2px; font-size:16px; }
.card .cap { color:var(--ink2); font-size:13px; margin:0 0 12px; line-height:1.4; }
.brow { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) 9.5rem; gap:10px; align-items:center; width:100%; border:0; background:none; text-align:left; padding:7px 6px; border-radius:8px; font-size:13.5px; min-height:36px; }
.brow:hover { background:var(--page); }
.brow .bt { height:10px; background:var(--page); border-radius:4px; overflow:hidden; }
.brow .bt i { display:block; height:100%; background:var(--blue); border-radius:0 4px 4px 0; }
.brow .bt.pl i { background:var(--fail); }
.brow .v { text-align:right; white-space:nowrap; font-weight:600; }
.brow .v small { color:var(--ink2); font-weight:500; margin-left:4px; }
table.mini { width:100%; border-collapse:collapse; font-size:13.5px; }
table.mini th { text-align:right; color:var(--ink2); font-size:12px; text-transform:uppercase; letter-spacing:.05em; padding:6px 8px; border-bottom:1px solid var(--line); }
table.mini th:first-child, table.mini td:first-child { text-align:left; }
table.mini td { text-align:right; padding:8px; border-bottom:1px solid var(--line); }
table.mini tr:last-child td { border-bottom:0; }
.hours { display:grid; grid-template-columns:repeat(24,minmax(0,1fr)); gap:2px; align-items:end; height:150px; border-bottom:1px solid var(--line); padding-top:22px; position:relative; }
.hours button { position:relative; height:100%; border:0; background:none; padding:0; display:flex; align-items:flex-end; border-radius:4px 4px 0 0; }
.hours button i { display:block; width:100%; background:var(--blue); border-radius:4px 4px 0 0; min-height:1px; }
.hours.pl button i { background:var(--fail); }
.hours button:hover i, .hours button:focus-visible i { filter:brightness(.8); }
.hours button .tip { display:none; position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:12px; font-weight:600; white-space:nowrap; padding:5px 8px; border-radius:6px; z-index:3; pointer-events:none; }
.hours button:hover .tip, .hours button:focus-visible .tip { display:block; }
.haxis { display:grid; grid-template-columns:repeat(4,1fr) auto; font-size:12px; color:var(--ink2); margin-top:4px; }

/* sheet */
.sheet { position:fixed; top:var(--head); right:0; bottom:0; width:min(500px,100%); background:var(--surface); border-left:1px solid var(--line); box-shadow:-10px 0 30px rgba(14,27,46,.14); z-index:20; display:flex; flex-direction:column; }
.sheet-bar { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); }
.sheet-bar .crumb { margin-right:auto; font-size:13px; color:var(--ink2); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.iconbtn { width:38px; height:38px; border-radius:10px; border:1px solid var(--ctrl); background:#fff; font:600 18px var(--ui); color:var(--ink); display:grid; place-items:center; flex:none; }
.sheet-body { overflow:auto; padding:16px 20px 40px; overscroll-behavior:contain; }
.eyebrow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; font-weight:700; color:var(--ink2); text-transform:uppercase; letter-spacing:.06em; }
.sheet h2 { font-size:22px; line-height:1.2; margin:8px 0 2px; text-wrap:balance; }
.sheet .sub { color:var(--ink2); margin:0 0 6px; }
.big { font-size:28px; font-weight:700; letter-spacing:-.01em; margin:8px 0 2px; }
.badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 10px; font-size:12.5px; font-weight:700; background:var(--page); border:1px solid var(--line); text-transform:none; letter-spacing:0; }
.badge.bad { background:var(--fail-soft); border-color:var(--fail); color:var(--fail); }
.badge.good { background:#E7F4EE; border-color:var(--green); color:var(--green); }
.voice { font:italic 400 18px/1.4 var(--voice); margin:14px 0 8px; text-wrap:pretty; }
.narr { line-height:1.5; margin:0 0 12px; }
.flow { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; align-items:center; border:1px solid var(--line); border-radius:var(--r); padding:10px; margin:12px 0; }
.flow .ar { color:var(--ink2); font-size:18px; }
.pbtn { display:block; width:100%; text-align:left; border:0; background:none; padding:6px; border-radius:8px; min-height:40px; }
.pbtn:hover { background:var(--page); }
.pbtn b { display:block; font-weight:600; line-height:1.25; color:var(--blue); }
.pbtn span { display:block; font-size:12.5px; color:var(--ink2); margin-top:2px; overflow-wrap:anywhere; }
.pbtn.plain b { color:var(--ink); }
a.pbtn { text-decoration:none; }
h3.sec { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink2); margin:20px 0 8px; border-top:1px solid var(--line); padding-top:14px; }
dl.kv { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 16px; margin:0; }
dl.kv div { min-width:0; }
dl.kv dt { font-size:12px; color:var(--ink2); font-weight:600; }
dl.kv dd { margin:2px 0 0; overflow-wrap:anywhere; }
.tags { display:flex; flex-wrap:wrap; gap:6px; }
.tag { font-size:12.5px; font-weight:600; border:1px solid var(--line); border-radius:6px; padding:4px 8px; background:var(--page); }
.tag.f { border-color:var(--fail); color:var(--fail); background:var(--fail-soft); }
.minirows { border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.mr { display:grid; grid-template-columns:70px minmax(0,1fr) auto; gap:10px; align-items:center; width:100%; border:0; border-bottom:1px solid var(--line); background:none; text-align:left; padding:8px 10px; font-size:13.5px; min-height:40px; }
.mr:last-child { border-bottom:0; }
.mr:hover { background:var(--page); }
.mr small { display:block; color:var(--ink2); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.acts { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 0; }
details.raw summary { cursor:pointer; font-weight:600; color:var(--blue); padding:8px 0; }
details.raw table { width:100%; border-collapse:collapse; font-size:12.5px; }
details.raw td { padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
details.raw td:first-child { color:var(--ink2); width:42%; font-family:ui-monospace, Menlo, Consolas, monospace; }
.btn.ai { display:inline-flex; align-items:center; gap:6px; }
@media (pointer: coarse) { .btn.ai { min-height:44px; } }
.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:999px; font-weight:600; z-index:40; box-shadow:var(--shadow); }
.scrim { position:fixed; inset:0; background:rgba(14,27,46,.32); z-index:15; }

@media (max-width: 1180px) {
  .tiles { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .g-hh { grid-template-columns:76px minmax(0,1fr) minmax(0,1fr) 90px 70px 70px; }
  .g-hh .c-tier, .g-hh .c-fee { display:none; }
}
@media (max-width: 900px) {
  :root { --head: 0px; }
  body { font-size:15px; }
  header.top { padding:10px 14px; }
  .layout { grid-template-columns:minmax(0,1fr); }
  aside.rail { position:fixed; left:0; top:0; bottom:0; width:min(340px,92vw); z-index:30; box-shadow:10px 0 30px rgba(14,27,46,.2); display:none; }
  body.rail-open aside.rail { display:block; }
  #rail-close { display:grid; }
  #filters-btn { display:inline-flex; }
  .content { padding:12px 14px 60px; }
  .cards { grid-template-columns:minmax(0,1fr); }
  .rhead { display:none; }
  .g-rec { grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"t k a" "w w w" "p p o"; row-gap:4px; }
  .g-rec .c-t { grid-area:t; } .g-rec .c-k { grid-area:k; } .g-rec .c-a { grid-area:a; } .g-rec .c-w { grid-area:w; } .g-rec .c-p { grid-area:p; } .g-rec .c-o { grid-area:o; text-align:right; }
  .g-hh, .g-per, .g-org { grid-template-columns:minmax(0,1fr) auto; row-gap:2px; }

      const a = R.actP[ac[i]], b = R.benP[bc[i]], f = R.fromP[fc[i]], t = R.toP[tc[i]];
      const seen = [];

  // ---------- facets ----------
  // A facet is a list of values with a code per row: arr[i] (single) or of[arr[i]] (multi).
  function facet(o) {
    const f = Object.assign({ multi: false, sel: new Set(), open: false, show: 8, q: '' }, o);
    f.counts = new Int32Array(f.values.length);
    return f;
  }
  function catFacet(T, col, id, label, opt = {}) {
    const c = T.cols[col], lab = opt.lab || human;
    return facet(Object.assign({ id, label, arr: c.c, raw: c.d, values: c.d.map((v) => ({ label: v === '' ? null : lab(v), sub: opt.sub ? opt.sub(v) : '' })) }, opt.extra || {}));
  }
  function tagFacet(sp, id, label, lab = human) { return facet({ id, label, multi: true, arr: sp.arr, of: sp.of, values: sp.tags.map((t) => ({ label: lab(t) })) }); }
  function arrFacet(arr, labels, id, label, extra = {}) { return facet(Object.assign({ id, label, arr, values: labels.map((l) => ({ label: l })) }, extra)); }
  function orderFacet(f, n) { // fixed order: by whole-day frequency unless told otherwise
    const tot = new Float64Array(f.values.length);
    for (let i = 0; i < n; i++) { const k = f.arr[i]; if (k < 0) continue; if (f.multi) for (const t of f.of[k]) tot[t]++; else tot[k]++; }
    f.total = tot;
    let idx = f.values.map((v, k) => k).filter((k) => f.values[k].label != null && tot[k] > 0);
    if (f.byValue) idx.sort((a, b) => (f.raw[a] < f.raw[b] ? -1 : f.raw[a] > f.raw[b] ? 1 : 0));
    else if (!f.fixed) idx.sort((a, b) => tot[b] - tot[a]);
    f.order = idx;
  }

  // search over dictionary-coded fields: every word must appear in one of the fields
  function searcher(n, fields) {
    const low = fields.map((f) => f.d.map((s) => String(s).toLowerCase()));
    return (q) => {
      const words = q.toLowerCase().split(/\s+/).filter(Boolean); if (!words.length) return null;
      const hit = words.map((w) => fields.map((f, j) => { const L = low[j], m = new Uint8Array(L.length); for (let k = 0; k < L.length; k++) if (L[k].includes(w)) m[k] = 1; return m; }));
      const mask = new Uint8Array(n);
      for (let i = 0; i < n; i++) {
        let ok = true;
        for (let w = 0; w < words.length && ok; w++) { let any = false; for (let j = 0; j < fields.length; j++) if (hit[w][j][fields[j].c[i]]) { any = true; break; } ok = any; }
        if (ok) mask[i] = 1;
      }
      return mask;
    };
  }

  // ---------- running a view: filter, count, sort ----------
  function run(v) {
    const n = v.n, act = v.facets.filter((f) => f.sel.size);
    for (const f of v.facets) { f.counts.fill(0); f.selMask = new Uint8Array(f.values.length); for (const k of f.sel) f.selMask[k] = 1; }
    const mask = v.q ? (v._qmask && v._qq === v.q ? v._qmask : (v._qq = v.q, v._qmask = v.search(v.q))) : null;
    const out = new Int32Array(n); let m = 0;
    const F = v.facets, nF = F.length;
    const pass = (f, i) => { const k = f.arr[i]; if (k < 0) return false; if (!f.multi) return f.selMask[k] === 1; for (const t of f.of[k]) if (f.selMask[t]) return true; return false; };
    const add = (f, i) => { const k = f.arr[i]; if (k < 0) return; if (!f.multi) f.counts[k]++; else for (const t of f.of[k]) f.counts[t]++; };
    for (let i = 0; i < n; i++) {
      if (mask && !mask[i]) continue;
      if (v.extra && !v.extra(i, v)) continue;
      let miss = null, nm = 0;
      for (let a = 0; a < act.length; a++) if (!pass(act[a], i)) { nm++; miss = act[a]; if (nm > 1) break; }
      if (nm === 0) { out[m++] = i; for (let j = 0; j < nF; j++) add(F[j], i); }
      else if (nm === 1) add(miss, i);
    }
    let idx = out.subarray(0, m);
    const s = v.sorts.find((x) => x.id === v.sort);
    if (s && s.key) {
      const K = s.key, dir = s.asc ? 1 : -1, arr = Array.from(idx);
      arr.sort((a, b) => { const x = K[a], y = K[b]; const xf = Number.isFinite(x), yf = Number.isFinite(y); if (!xf || !yf) return xf ? -1 : yf ? 1 : a - b; return x === y ? a - b : dir * (x - y); });
      idx = Int32Array.from(arr);
    }
    v.idx = idx;
    return idx;
  }

  function closeRail() { document.body.classList.remove('rail-open'); if ($('#sheet').hidden) $('#scrim').hidden = true; }
  function refresh(focusKey) {

  function renderFacets(v, focusKey, filterFocus) {

      const selFirst = ord.filter((k) => f.sel.has(k)), rest = ord.filter((k) => !f.sel.has(k));

  function renderChips(v) {

    if (v.time && (v.time[0] > 0 || v.time[1] < 24)) c.push(`<span class="fchip"><small>Time</small> ${hourLabel(v.time[0])} to ${hourLabel(v.time[1])}<button data-rm="_t:0" aria-label="Clear time of day">×</button></span>`);
    for (const f of v.facets) for (const k of f.sel) c.push(`<span class="fchip">${f.values.length > 1 ? `<small>${esc(f.label)}</small> ` : ''}${esc(f.values[k].label)}<button data-rm="${f.id}:${k}" aria-label="Remove ${esc(f.values[k].label)}">×</button></span>`);

  function renderToolbar(v) {

      <input type="radio" name="mode" id="m-group" value="group" ${v.mode === 'group' ? 'checked' : ''}><label for="m-group">Group by</label></fieldset>` : '';

  function renderResults(v) {
    const host = $('#results');

  // group-by over the filtered records
  function renderGroups(v, host) {
    const R = D.rec, dim = v.dims.find((d) => d.id === v.group), f = dim.facet;
    const arr = f ? f.arr : dim.arr, size = f ? f.values.length : dim.labels.length;
    const G = { n: new Float64Array(size), amt: new Float64Array(size), fee: new Float64Array(size), min: new Float64Array(size), wait: new Float64Array(size), fail: new Float64Array(size) };
    const amt = R.cols.amount_gross.v, fee = R.cols.fee_amount.v, tm = R.cols.time_minutes.v, wt = R.cols.wait_minutes.v;
    const addTo = (k, i) => { G.n[k]++; G.amt[k] += amt[i] || 0; G.fee[k] += fee[i] || 0; G.min[k] += tm[i] || 0; G.wait[k] += wt[i] || 0; G.fail[k] += R.fail[i]; };
    for (const i of v.idx) { const k = arr[i]; if (k < 0) continue; if (f && f.multi) for (const t of f.of[k]) addTo(t, i); else addTo(k, i); }
    const label = (k) => (f ? f.values[k].label : dim.labels[k]);
    let keys = []; for (let k = 0; k < size; k++) if (G.n[k] > 0 && label(k) != null) keys.push(k);
    const M = { n: G.n, amt: G.amt, fee: G.fee, min: G.min, wait: G.wait, failr: G.n.map((x, k) => (x ? G.fail[k] / x : 0)) };
    const fixedDim = dim.fixed || (f && f.fixed);
    if (fixedDim && !v.gsortUser) keys.sort((a, b) => (f ? f.order.indexOf(a) - f.order.indexOf(b) : a - b));
    else keys.sort((a, b) => M[v.gsort][b] - M[v.gsort][a] || G.n[b] - G.n[a]);
    const total = keys.length, shown = keys.slice(0, 300), max = Math.max(...shown.map((k) => M[v.gsort][k]), 1e-9);
    const cols = [['n', 'Records'], ['amt', 'Money'], ['fee', 'Fees'], ['min', 'Time spent'], ['wait', 'Waiting'], ['failr', "Didn't work"]];
    const cell = (id, k) => id === 'n' ? fmt(G.n[k]) : id === 'amt' ? usdC(G.amt[k]) : id === 'fee' ? usdC(G.fee[k]) : id === 'min' ? hrs(G.min[k]) : id === 'wait' ? hrs(G.wait[k]) : pct(G.fail[k], G.n[k]);
    if (!shown.length) { host.innerHTML = `<div class="rows"><div class="empty">Nothing matches these filters.</div></div>`; return; }
    v._gkeys = shown; v._gdim = dim;
    host.innerHTML = `<div class="rows"><div class="rhead g-grp"><span>${esc(dim.label)}</span>${cols.map(([id, l]) => `<button class="sorth" data-gs="${id}" aria-pressed="${(!fixedDim || v.gsortUser) && v.gsort === id}">${esc(l)}</button>`).join('')}</div>
      ${shown.map((k) => `<button class="rr g-grp" data-g="${k}" aria-label="${esc(label(k))}: ${fmt(G.n[k])} records. Show them.">
        <span><b class="one">${esc(label(k))}</b>${f && f.values[k].sub ? `<small>${esc(f.values[k].sub)}</small>` : dim.party ? `<small>${esc(dim.party[k])}</small>` : ''}<span class="gbar" aria-hidden="true"><i style="width:${(100 * M[v.gsort][k]) / max}%"></i></span></span>
        ${cols.map(([id]) => `<span class="num ${id === 'failr' && G.fail[k] ? 'bad' : ''}">${cell(id, k)}</span>`).join('')}</button>`).join('')}</div>
      <div class="pager"><span class="muted">${total > 300 ? `Top 300 of ${fmt(total)} groups. ` : `${fmt(total)} groups. `}Bars show the sorted column. Select a group to see its records${dim.party ? ' (or the party)' : ''}.${f && f.multi ? ' A record with several tags counts once in each.' : ''}</span></div>`;
  }
  function groupClick(v, k) {

  // ---------- Copy for AI: a record as JSON with the context an assistant needs, to paste into a chat (clipboard only) ----------

  async function copyText(text, back) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) { /* try the older way */ }
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';

      ${actor ? partyBtn(actor, D.partyLabel(actor), 'Did the job · ' + actor) : ''}
      ${ben && ben !== actor ? partyBtn(ben, D.partyLabel(ben), 'Benefited · ' + ben) : ''}
      ${hid ? `<button class="pbtn" data-open="household-${esc(hid)}"><b>Household ${esc(hid)}</b><span>${esc(TIER_L[R.tier[i]])} · see the household's whole day</span></button>` : '<p class="muted">No household: a record between organizations.</p>'}
      ${relRow >= 0 || backRefs.length ? `<h3 class="sec">Linked records</h3>${relRow >= 0 ? `<p class="muted" style="margin:0 0 6px">This record follows:</p>${recList([relRow])}` : ''}${backRefs.length ? `<p class="muted" style="margin:10px 0 6px">Records that follow this one:</p>${recList(backRefs)}` : ''}` : ''}
      <details class="raw"><summary>All ${R.names.length} fields</summary><table>${R.names.map((nm) => `<tr><td>${esc(nm)}</td><td>${esc(R.cols[nm].kind === 'num' ? (Number.isFinite(R.v(nm, i)) ? R.v(nm, i) : '') : R.s(nm, i))}</td></tr>`).join('')}</table></details>`;
  }
  function householdHTML(id) {
    const HH = D.hh, h = HH.row(id); if (h < 0) return '';
    const s = (c) => HH.s(c, h), num = (c) => HH.v(c, h), L = D.led, l = HH.led[h];
    const members = []; const pc = D.per.cols.household_id, code = pc.m.get(id); if (code !== undefined) for (let p = 0; p < D.per.n; p++) if (pc.c[p] === code) members.push(p);
    const recs = recordsWhere((i) => D.rec.hh[i] === h);
    const lv = (c) => (l >= 0 ? L.v(c, l) : NaN);
    const notes = s('notes').split(';').filter(Boolean);
    return `<div class="eyebrow"><span>Household · ${esc(id)}</span><span class="badge">${esc(TIER_L[HH.tier[h]])}</span></div>
      <h2>${esc(hhType(s('household_type')))}, ${fmt(num('size'))} ${num('size') === 1 ? 'person' : 'people'}</h2><p class="sub">${esc(dname(s('district')))}</p>
      <div class="big">${usd0(num('annual_income'))}<span class="muted" style="font-size:15px;font-weight:600"> a year</span></div>
      ${kv([['Income sources', esc(s('income_source_mix').split(';').map((x) => { const [k, w] = x.split(':'); return human(k) + (w ? ' ' + Math.round(+w * 100) + '%' : ''); }).join(', '))],
        ['Housing', esc(human(s('housing_tenure')))], ['Housing cost', usd0(num('monthly_housing_cost')) + ' a month'], ['Banking', esc(human(s('banked_status')))],
        ['Vehicles', fmt(num('vehicles'))], ['Internet at home', esc(human(s('internet_at_home')))], ['Primary language', esc(s('primary_language'))]])}
      ${notes.length ? `<div class="tags" style="margin-top:10px">${notes.map((t) => `<span class="tag">${esc(t === 'could_not_cover_$400_from_cash_or_equivalent' ? "Couldn't cover $400 from cash" : human(t.replace('=', ': ')))}</span>`).join('')}</div>` : ''}
      ${l >= 0 ? `<h3 class="sec">Money today</h3>${kv([['Opened the day with', usd(lv('open_net'))], ['Closed the day with', usd(lv('close_net'))], ['Money in', usd(lv('inflows'))], ['Money out', usd(lv('outflows'))],
        ['Checking', usd(lv('open_checking')) + ' → ' + usd(lv('close_checking'))], ['Cash', usd(lv('open_cash')) + ' → ' + usd(lv('close_cash'))], ['Savings', usd(lv('close_savings'))], ['Card debt', usd(lv('close_card_debt'))],
        ['SNAP balance', lv('snap_open') > 0 || lv('snap_close') > 0 ? usd(lv('snap_open')) + ' → ' + usd(lv('snap_close')) : ''], ['Could cover $400', esc(human(L.s('could_cover_400_emergency', l)))], ['Reconciles', esc(human(L.s('reconciles', l)))]])}` : ''}
      <h3 class="sec">Who lives here</h3>${members.map((p) => partyBtn(D.per.s('person_id', p), D.personShort(p), human(D.per.s('relationship_to_head', p)) + ' · ' + D.per.s('person_id', p))).join('') || '<p class="muted">No members listed.</p>'}
      <h3 class="sec">Today: ${fmt(recs.length)} records</h3>
      ${kv([["Didn't work", fmt(HH.nfail[h])], ['Fees', usd(HH.fees[h])], ['Unpaid work', mins(HH.unpaid[h])]])}
      <div class="acts" style="margin-bottom:10px"><button class="btn" data-scope="household-${esc(id)}">Show these in Records</button></div>
      ${recList(recs)}`;
  }
  function personHTML(id) {
    const P = D.per, p = P.row(id); if (p < 0) return '';
    const s = (c) => P.s(c, p), hid = s('household_id'), emp = s('employer_org_id'), care = s('caregiver_for');
    const test = scopeTest('person', id), recs = recordsWhere(test);
    const ben = s('benefits_received').split(';').filter((x) => x && x !== 'none');
    return `<div class="eyebrow"><span>Person · ${esc(id)}</span><span class="badge">${esc(P.tier[p] < 3 ? TIER_L[P.tier[p]] : '')}</span></div>
      <h2>${esc(D.personShort(p))}</h2><p class="sub">${esc(human(s('relationship_to_head')))} · ${esc(P.dist[p] >= 0 ? dname(D.hh.cols.district.d[P.dist[p]]) : '')}</p>
      ${kv([['Age', fmt(P.v('age', p))], ['Sex', s('sex') === 'F' ? 'Female' : s('sex') === 'M' ? 'Male' : esc(s('sex'))], ['Race and ethnicity', esc(human(s('race_ethnicity')))], ['Education', esc(human(s('education')))],
        ['Work', esc(human(s('employment_status')))], ['Occupation', esc(s('occupation'))], ['Industry', esc(s('industry_sector'))], ['Schedule', s('work_schedule') !== 'none' ? esc(human(s('work_schedule'))) : ''],
        ['Paid', s('pay_cadence') !== 'none' ? esc(human(s('pay_cadence'))) : ''], ['Union member', esc(human(s('union_member')))], ['Health coverage', esc(human(s('health_coverage')))], ['Disability', esc(human(s('disability')))]])}
      ${ben.length ? `<h3 class="sec">Benefits</h3><div class="tags">${ben.map((b) => `<span class="tag">${esc(human(b.replace(/\((.*)\)/, ' ($1)').replace(/pay:|issue_day:/, '')))}</span>`).join('')}</div>` : ''}
      <h3 class="sec">Connections</h3>
      ${partyBtn('H' + hid.slice(1), 'Household ' + hid, hhType(D.hh.s('household_type', D.hh.row(hid))))}
      ${emp ? partyBtn(emp, D.partyLabel(emp), 'Employer · ' + emp) : ''}
      ${care && care !== 'none' ? care.split(';').map((c) => partyBtn(c, D.partyLabel(c), 'Cares for · ' + c)).join('') : ''}
      <h3 class="sec">Today: ${fmt(recs.length)} records</h3>
      <div class="acts" style="margin-bottom:10px"><button class="btn" data-scope="person-${esc(id)}">Show these in Records</button></div>
      ${recList(recs)}`;
  }
  function orgHTML(id) {
    const O = D.org, o = O.row(id); if (o < 0) return '';
    const s = (c) => O.s(c, o), recs = recordsWhere(scopeTest('org', id));
    const shown = recs.length > 400 ? recs.filter((_, k) => k < 400) : recs;
    return `<div class="eyebrow"><span>${esc(human(s('org_type')))} · ${esc(id)}</span></div>
      <h2>${esc(s('name'))}</h2><p class="sub">${esc(s('sector'))} · ${esc(dname(s('district')))}</p>
      ${kv([['Employees', Number.isFinite(O.v('size_employees', o)) ? fmt(O.v('size_employees', o)) : '—'], ['Hours', esc(s('hours'))], ['Accepts', esc(s('accepts').split(';').filter(Boolean).map(human).join(', '))], ['Notes', esc(s('notes'))]])}
      <h3 class="sec">Today: ${fmt(recs.length)} records</h3>
      ${kv([['Records received', fmt(O.nin[o])], ['Money received', usd0(O.ain[o])], ['Records paid out', fmt(O.nout[o])], ['Money paid out', usd0(O.aout[o])], ["Didn't work here", fmt(O.nfail[o])]])}
      <div class="acts" style="margin-bottom:10px"><button class="btn" data-scope="org-${esc(id)}">Show these in Records</button></div>
      ${recList(shown)}`;
  }

  // ---------- routing ----------
  function go(name) { if (location.hash !== '#' + name) { try { history.pushState(null, '', '#' + name); } catch (e) { /* ignore */ } } route(); }
  function route() {
    if (!D) return;
    const h = location.hash.slice(1);
    const m = /^(record|household|person|org)-([A-Za-z0-9]+)$/.exec(h);
    if (m) { if (!view.innerHTML) show(cur); openEntity(m[1], m[2], true); return; }
    if (!sheet.hidden) { stack.length = 0; sheet.hidden = true; $('#scrim').hidden = true; }
    show(['records', 'households', 'people', 'organizations', 'summary'].includes(h) ? h : 'records');
  }
  function show(name) {
    cur = name; closeRail();
    $$('nav.tabs a').forEach((a) => a.setAttribute('aria-current', a.dataset.v === name ? 'page' : 'false'));
    view.onclick = null;
    if (name === 'summary') renderSummary(); else renderView(name);
    document.title = 'Medianville Data Explorer · ' + name.charAt(0).toUpperCase() + name.slice(1);
  }
  window.addEventListener('popstate', route);
  window.addEventListener('hashchange', route);

  // ---------- start ----------
  const setBar = (p) => { $('#load-bar').style.width = (p * 100).toFixed(1) + '%'; $('#progress i').style.width = (p * 100).toFixed(1) + '%'; };
  async function start() {
    $('#retry').hidden = true; $('#status').classList.remove('err');
    try {
      await loadScript(FFLATE);
      await pickRun();
      $('#load-h').textContent = 'Loading ' + dayLong();
      $('#load-msg').textContent = 'Downloading the run (' + Math.round(RUN_BYTES / 1e6) + " MB). It's unpacked in your browser.";
      $('#status').textContent = 'Downloading the day…';
      const bytes = await download((p) => { setBar(p * 0.55); $('#load-sub').textContent = Math.round(p * 100) + '% downloaded'; });
      $('#load-msg').textContent = 'Reading the tables.';
      const raw = {};
      const plan = [['org', 'organizations', ['size_employees']], ['hh', 'households', ['weight', 'size', 'annual_income', 'monthly_housing_cost', 'vehicles']], ['per', 'people', ['age']],
        ['led', 'household money', ['wallets', 'open_checking', 'open_cash', 'open_prepaid', 'open_savings', 'open_card_debt', 'inflows', 'outflows', 'close_checking', 'close_cash', 'close_prepaid', 'close_savings', 'close_card_debt', 'open_net', 'close_net', 'snap_open', 'snap_close']],
        ['rec', 'records', ['amount_gross', 'amount_paid_by_user', 'amount_paid_by_third_party', 'imputed_public_cost', 'sales_tax', 'fee_amount', 'time_minutes', 'wait_minutes', 'travel_miles']]];
      const weight = { org: 0.01, hh: 0.06, per: 0.12, led: 0.05, rec: 0.76 }; let done = 0;
      for (const [k, label, num] of plan) {
        if (!bytes[k]) continue;
        $('#load-sub').textContent = 'Reading ' + label + '…';
        raw[k] = await parseCSV(bytes[k], num, (p) => setBar(0.55 + 0.4 * (done + weight[k] * p)));
        done += weight[k]; bytes[k] = null; await tick();
      }
      $('#load-sub').textContent = 'Linking records to households, people and places…'; await tick();
      D = derive(raw); buildViews(); setBar(1);
      $('#status').textContent = fmt(D.rec.n) + ' records · ' + dayLong(false);
      $('#loading').hidden = true; $('#view').hidden = false;
      setTimeout(() => ($('#progress i').style.opacity = 0), 400);
      if (!location.hash) { try { history.replaceState(null, '', '#records'); } catch (e) { /* ignore */ } }
      route();
    } catch (e) {
      console.error(e);
      $('#status').textContent = "Couldn't load the day"; $('#status').classList.add('err');
      $('#load-msg').textContent = "The run couldn't be loaded: " + (e && e.message ? e.message : e) + '.';
      $('#load-sub').textContent = 'Check your connection and try again.'; $('#retry').hidden = false;
    }
  }
  $('#retry').onclick = start;
  window.HX = { get D() { return D; }, V, run };
  start();
})();
</script>
</body>
</html>
